:root{
  --paper:#F4F6F9;
  --surface:#FFFFFF;
  --surface-2:#FBFCFE;
  --ink:#161A22;
  --ink-soft:#39414F;
  --muted:#717A8C;
  --line:#E5E9F0;
  --line-2:#D3D9E4;
  --accent:#3A55D9;
  --accent-ink:#26308f;
  --accent-weak:#EBEEFD;
  --ok:#1F9D6B;
  --warn:#C2410C;
  --danger:#D63D52;
  --radius:10px;
  --radius-sm:7px;
  --shadow:0 1px 2px rgba(22,26,34,.05), 0 8px 24px rgba(22,26,34,.05);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono','SFMono-Regular',Menlo,monospace;font-variant-numeric:tabular-nums;}
.display{font-family:'Space Grotesk','Inter',sans-serif;}

.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 80px;}

/* ---------- header ---------- */
.app-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.brand{display:flex;flex-direction:column;gap:2px;}
.brand .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.brand h1{font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.1;}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  font:inherit;font-size:13px;font-weight:500;
  padding:8px 13px;border-radius:var(--radius-sm);
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-soft);
  cursor:pointer;transition:.13s ease;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn svg{width:15px;height:15px;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff;}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.ghost:hover{background:var(--accent-weak);border-color:transparent;}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent;}
.btn.danger:hover{background:#fdecef;color:var(--danger);border-color:transparent;}
.btn.sm{padding:5px 9px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.lock-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:600;}
.lock-chip.locked{background:#fff;border:1px solid var(--line-2);color:var(--muted);cursor:pointer;}
.lock-chip.locked:hover{border-color:var(--accent);color:var(--accent);}
.lock-chip.open{background:var(--accent-weak);color:var(--accent-ink);}

/* ---------- panel ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.panel-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;display:flex;align-items:center;gap:9px;}
.panel-body{padding:16px;}

/* ---------- segmented ---------- */
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line-2);border-radius:99px;padding:3px;gap:2px;}
.seg button{font:inherit;font-size:12.5px;font-weight:600;padding:6px 14px;border:none;background:transparent;color:var(--muted);border-radius:99px;cursor:pointer;transition:.12s;}
.seg button.on{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 2px rgba(22,26,34,.12);}
.seg.compact button{padding:5px 11px;font-size:12px;}

/* ---------- summer weeks bar ---------- */
.wn-select{font-family:inherit;font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:5px 8px;cursor:pointer;max-width:240px;}
.wn-select:hover{border-color:var(--accent);}
.weeks-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);}
.week-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-radius:99px;border:1px solid var(--line-2);background:#fff;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--ink-soft);}
.week-chip.on{border-color:var(--accent);background:var(--accent-weak);color:var(--accent-ink);}
.week-chip select{font:inherit;font-size:11px;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:5px;padding:1px 2px;}
.week-chip .x{display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center;border-radius:99px;opacity:.5;}
.week-chip .x:hover{opacity:1;background:#fde7ea;color:var(--danger);}

/* ---------- palette ---------- */
.palette{padding:14px 16px;border-bottom:1px solid var(--line);}
.palette-hint{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.pal-group{margin-bottom:9px;}
.pal-group:last-child{margin-bottom:0;}
.pal-group-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 8px;border-radius:99px;border:1.5px solid transparent;background:var(--surface);font-size:12.5px;font-weight:500;cursor:pointer;color:var(--ink-soft);transition:.1s;box-shadow:inset 0 0 0 1px var(--line);}
.chip:hover{box-shadow:inset 0 0 0 1px var(--line-2);}
.chip.on{box-shadow:none;border-color:var(--ink);background:var(--surface);}
.chip .swatch{width:13px;height:13px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
.chip.erase{color:var(--muted);}
.chip.erase .swatch{background:repeating-linear-gradient(45deg,#fff,#fff 3px,#e9ecf2 3px,#e9ecf2 6px);}

/* ---------- day tabs ---------- */
.daytabs{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);}
.days{display:flex;gap:3px;flex-wrap:wrap;}
.day{font:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border:none;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;position:relative;}
.day .dot{display:inline-block;width:5px;height:5px;border-radius:99px;background:var(--accent);margin-left:6px;vertical-align:middle;opacity:0;}
.day.has .dot{opacity:1;}
.day.on{background:var(--ink);color:#fff;}
.day.on .dot{background:#fff;}

/* ---------- grid ---------- */
.grid-scroll{overflow:auto;max-height:560px;position:relative;}
.grid{display:grid;background:var(--line);gap:1px;min-width:min-content;}
.g-cell{background:var(--surface);min-height:25px;height:25px;}
.g-head{background:var(--surface-2);position:sticky;top:0;z-index:3;padding:8px 6px;font-size:11.5px;font-weight:600;color:var(--ink-soft);text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.15;min-height:42px;}
.g-time{background:var(--surface-2);position:sticky;left:0;z-index:2;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;font-size:10.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.g-time.hour{color:var(--ink-soft);font-weight:600;}
.g-corner{background:var(--surface-2);position:sticky;left:0;top:0;z-index:4;}
.g-slot{background:var(--surface);cursor:crosshair;position:relative;transition:background .04s;touch-action:none;}
.g-slot.hour{box-shadow:inset 0 1px 0 var(--line-2);}
.g-slot:hover{background:var(--accent-weak);}
.g-slot.filled:hover{filter:brightness(.94);}
.g-slot .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:rgba(0,0,0,.5);pointer-events:none;overflow:hidden;}

/* ---------- report ---------- */
.rep-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.rep-controls .left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.field{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);}
.field select{font:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--line-2);border-radius:7px;background:#fff;color:var(--ink);cursor:pointer;}
.cost-note{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line-2);padding:8px 12px;border-radius:8px;}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.kard{border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;background:var(--surface-2);}
.kard .k-lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.kard .k-val{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;margin-top:4px;letter-spacing:-.01em;}
.kard.accent{background:var(--accent-weak);border-color:#cdd5fb;}
.kard.accent .k-val{color:var(--accent-ink);}

table.rep{width:100%;border-collapse:collapse;font-size:13px;}
table.rep th,table.rep td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);}
table.rep th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;}
table.rep td.num,table.rep th.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
table.rep tr.tot td{font-weight:700;border-top:2px solid var(--line-2);border-bottom:none;background:var(--surface-2);}
table.rep tr.clickable{cursor:pointer;}
table.rep tr.clickable:hover{background:var(--surface-2);}
table.rep tr.detail td{background:var(--surface-2);padding-top:0;padding-bottom:0;}
.detail-inner{padding:4px 0 10px;}
.detail-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0;font-size:12.5px;}
.detail-row .dl{display:flex;align-items:center;gap:8px;color:var(--ink-soft);}
.detail-row .swatch{width:10px;height:10px;border-radius:3px;flex:none;}
.detail-row .dn{font-family:'IBM Plex Mono',monospace;color:var(--muted);}
.name-cell{display:flex;align-items:center;gap:9px;}
.name-cell .swatch{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);}
.grp-row td{background:#fff;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:14px;}
.chev{transition:.15s;display:inline-block;color:var(--muted);}
.chev.open{transform:rotate(90deg);}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(22,26,34,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;backdrop-filter:blur(2px);}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(22,26,34,.28);width:100%;max-width:540px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);}
.modal-head h3{margin:0;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;}
.modal-body{padding:16px 18px;overflow:auto;}
.modal-foot{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;}
.iconbtn{width:30px;height:30px;border-radius:7px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.iconbtn:hover{background:var(--paper);color:var(--ink);}
.iconbtn.del:hover{background:#fde7ea;color:var(--danger);}

.list-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:none;}
input.txt{font:inherit;font-size:13.5px;padding:8px 11px;border:1px solid var(--line-2);border-radius:8px;background:#fff;color:var(--ink);width:100%;}
input.txt:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak);}
input.rate{width:88px;text-align:right;font-family:'IBM Plex Mono',monospace;}
.color-dot{width:24px;height:24px;border-radius:7px;border:none;cursor:pointer;flex:none;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
.swatch-pop{display:flex;flex-wrap:wrap;gap:5px;padding:8px;background:#fff;border:1px solid var(--line-2);border-radius:9px;box-shadow:var(--shadow);position:absolute;z-index:10;}
.swatch-pop button{width:20px;height:20px;border-radius:5px;border:none;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
.muted{color:var(--muted);}
.tiny{font-size:11.5px;}
.warn-box{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.5;}
.add-inline{display:flex;gap:8px;margin-top:12px;}
.field-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 6px;}
.pwd-row{display:flex;gap:8px;align-items:center;}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:13px;}

@media (max-width:680px){
  .cards{grid-template-columns:1fr;}
  .brand h1{font-size:23px;}
  .wrap{padding:16px 12px 70px;}
}

/* ---------- summer week chip dates ---------- */
.week-chip{flex-wrap:wrap;}
.week-chip .wk-label{font-weight:600;}
.week-chip .wk-range{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
.week-chip.on .wk-range{color:var(--accent-ink);}
.week-chip .wk-date{font:inherit;font-size:11px;border:1px solid var(--line-2);border-radius:6px;background:#fff;color:var(--muted);padding:2px 4px;cursor:pointer;width:124px;}

/* ---------- day tab date ---------- */
.day{display:inline-flex;align-items:center;gap:5px;}
.day .ddate{font-size:10px;font-family:'IBM Plex Mono',monospace;opacity:.7;}

/* ---------- grid header / ferie ---------- */
.g-head{flex-direction:column;gap:2px;}
.g-head.vac{color:var(--muted);}
.ferie-badge{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#9a3412;background:#ffedd5;padding:1px 6px;border-radius:99px;}
.g-slot.ferie{
  background-image:repeating-linear-gradient(45deg, rgba(120,130,150,.30) 0 4px, rgba(120,130,150,0) 4px 8px);
  cursor:not-allowed;
}
.g-slot.ferie:hover{background-color:var(--surface);filter:none;}

/* ---------- ferie panel ---------- */
.cal-nav{display:flex;align-items:center;gap:6px;}
.cal-month{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;min-width:130px;text-align:center;}
.ferie-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding-bottom:2px;}
.cal-day{position:relative;min-height:52px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);cursor:pointer;padding:6px 7px;user-select:none;transition:.08s;touch-action:none;}
.cal-day:hover{border-color:var(--accent);}
.cal-day.out{opacity:.4;}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--line-2);}
.cal-day.vac{background:#fff1e7;border-color:#f7c69b;}
.cal-day.vac .cd-num{color:#9a3412;font-weight:700;}
.cal-day .cd-num{font-size:13px;font-weight:600;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
.cal-day .cd-others{position:absolute;bottom:5px;right:6px;font-size:10px;font-weight:700;color:#fff;background:var(--muted);border-radius:99px;padding:0 5px;}
.ferie-foot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:14px;}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.lg-dot{width:12px;height:12px;border-radius:4px;display:inline-block;}
.lg-dot.vac{background:#fff1e7;box-shadow:inset 0 0 0 1px #f7c69b;}
.lg-dot.oth{background:var(--muted);}
.ferie-note{flex-basis:100%;margin-top:2px;}
@media (max-width:680px){ .cal-day{min-height:42px;} }

/* ---------- read-only (view) mode ---------- */
.ro-pill{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--accent-ink);background:var(--accent-weak);padding:2px 8px;border-radius:99px;margin-right:6px;}
.ro-pill svg{width:12px;height:12px;}
.chip.legend{cursor:default;box-shadow:inset 0 0 0 1px var(--line);}
.chip.legend:hover{box-shadow:inset 0 0 0 1px var(--line);}
.g-slot.ro{cursor:default;}
.g-slot.ro:hover{background-color:var(--surface);filter:none;}
.g-slot.ro.filled:hover{filter:none;}
.cal-day.ro{cursor:default;}
.cal-day.ro:hover{border-color:var(--line);}

/* ---------- propose bar / banner ---------- */
.propose-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);}
.propose-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 16px;border-bottom:1px solid #f7c69b;background:#fff7ed;}
.propose-banner .pb-left{display:flex;align-items:center;gap:10px;flex:1;min-width:240px;}
.propose-banner .pb-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pb-tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9a3412;background:#ffedd5;padding:3px 9px;border-radius:99px;}
.week-chip.disabled{opacity:.5;cursor:default;}

/* ---------- salary comparison ---------- */
.salary-block{margin:18px 0 4px;padding-top:16px;border-top:1px solid var(--line);}
.sb-head{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;margin-bottom:10px;}

/* ---------- weekend ---------- */
.we-legend{margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.we-month{margin-bottom:12px;}
.we-month-h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:10px 0 4px;}
.we-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.we-row.closed{opacity:.62;}
.we-date{width:130px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px;text-transform:capitalize;}
.we-tag{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-weak);padding:1px 6px;border-radius:99px;}
.we-toggle{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line-2);border-radius:7px;padding:5px 11px;cursor:pointer;background:#fff;width:84px;}
.we-toggle.on{color:var(--ok);border-color:#a7e0c8;background:#f0faf5;}
.we-toggle.off{color:var(--danger);border-color:#f3b9c2;background:#fdeef0;}
.we-sel{font:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--line-2);border-radius:7px;background:#fff;color:var(--ink);cursor:pointer;min-width:170px;}
.we-sel.narrow{min-width:auto;width:88px;}
.we-sel:disabled{opacity:.5;}
.we-pay{margin-left:auto;font-weight:600;min-width:74px;text-align:right;}
.we-ro{margin-left:8px;color:var(--ink-soft);}
.we-closed-lbl{color:var(--danger);font-weight:600;}
.we-extra-add{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
.we-totals{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}

/* ---------- proposals modal ---------- */
.prop-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:var(--surface-2);}
.prop-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
.prop-author{font-weight:600;font-size:14px;}
.prop-actions{display:flex;gap:6px;flex:none;}
.prop-changes{display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line);padding-top:8px;}
.prop-change{display:flex;align-items:center;gap:10px;}
.pc-when{font-family:'IBM Plex Mono',monospace;color:var(--muted);width:84px;flex:none;}
.pc-who{width:120px;flex:none;font-weight:500;}
.pc-diff{flex:1;}

/* ---------- collaborators list head ---------- */
.list-head{display:flex;align-items:center;gap:9px;padding:4px 0 6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);}

/* ---------- page nav ---------- */
.page-nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow);}
.page-nav .pg{font:inherit;font-size:13px;font-weight:600;padding:9px 15px;border:none;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;transition:.12s;}
.page-nav .pg:hover:not(:disabled){background:var(--paper);color:var(--ink);}
.page-nav .pg.on{background:var(--ink);color:#fff;}
.page-nav .pg:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- special week chip ---------- */
.week-chip.special{border-style:dashed;}
.week-chip.special.on{border-style:solid;border-color:#c084fc;background:#f6efff;color:#6b21a8;}
.week-chip.special.on .wk-range{color:#7c3aed;}

/* ---------- gare ---------- */
.we-gare{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.gara-row{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.gara-date{width:130px;font-size:12.5px;font-weight:500;text-transform:capitalize;flex:none;}
.gara-add{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;}

/* ---------- courses ---------- */
.course-row{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.course-date{width:126px;font-size:12.5px;font-weight:500;text-transform:capitalize;flex:none;}
.course-add{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
.course-kind{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-weak);padding:1px 6px;border-radius:99px;margin-right:4px;}

/* ---------- rate overrides ---------- */
.rate-overrides{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin:2px 0 12px 34px;}
.ov-row{display:flex;align-items:center;gap:8px;padding:4px 0;}
.ov-name{flex:1;font-size:13px;}
.ov-row .rate{width:88px;}

/* ---------- per-week collaborator visibility ---------- */
.g-head{position:relative;}
.col-hide{position:absolute;top:2px;right:2px;width:16px;height:16px;border:none;background:transparent;color:var(--muted);border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;opacity:0;transition:.1s;padding:0;}
.col-hide svg{width:11px;height:11px;}
.g-head:hover .col-hide{opacity:.65;}
.col-hide:hover{opacity:1;background:#fde7ea;color:var(--danger);}
.hidden-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);}

/* ---------- cloud ---------- */
.cloud-chip{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:99px;border:1px solid var(--line-2);background:#fff;cursor:pointer;transition:.13s;}
.cloud-chip svg{width:15px;height:15px;}
.cloud-chip.off{color:var(--muted);}
.cloud-chip.off:hover{border-color:var(--accent);color:var(--accent);}
.cloud-chip.warn{color:#9a3412;border-color:#fed7aa;background:#fff7ed;}
.cloud-chip.ok{color:#0f7a52;border-color:#a7e0c8;background:#f0faf5;}
.acc-status{display:flex;align-items:center;gap:10px;}
.acc-status .dot{width:10px;height:10px;border-radius:99px;background:var(--muted);flex:none;}
.acc-status .dot.ok{background:var(--ok);}
.acc-status .dot.err{background:var(--danger);}

/* ---------- program courses ---------- */
.prog-row{padding:10px 0;border-bottom:1px solid var(--line);}
.prog-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.prog-ro{display:flex;align-items:center;gap:8px;font-size:13px;}
.prog-ro .swatch{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);}
.prog-collabs{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:8px;}
.mini-chip{font:inherit;font-size:11.5px;font-weight:500;padding:4px 9px;border-radius:99px;border:1px solid var(--line-2);background:#fff;color:var(--muted);cursor:pointer;transition:.1s;}
.mini-chip:hover{border-color:var(--accent);color:var(--accent);}
.mini-chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.prog-add{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}

/* course-generated grid cell marker */
.g-slot.course{cursor:default;}
.g-slot.course::after{content:"";position:absolute;top:0;left:0;border-width:7px;border-style:solid;border-color:rgba(255,255,255,.85) transparent transparent rgba(255,255,255,.85);}

/* ---------- shift label in cell ---------- */
.slot-lbl{position:absolute;left:4px;right:3px;top:1px;font-size:9.5px;font-weight:700;line-height:1.1;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;}

/* ---------- ferie: all collaborators ---------- */
.cal-day.multi{min-height:66px;display:flex;flex-direction:column;}
.cd-people{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px;overflow:hidden;}
.cd-chip{font-size:9px;font-weight:700;color:#fff;border-radius:4px;padding:1px 4px;line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cd-chip.more{background:var(--muted)!important;}
.cal-day.multi.vac{background:#fff1e7;border-color:#f7c69b;}
.ferie-people{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);}
.fp-item{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);}
.fp-dot{width:11px;height:11px;border-radius:4px;flex:none;}

/* ---------- iscritti ---------- */
.isc-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.isc-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.pill{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;}
.pill.danger{background:#fdeef0;color:#b3243b;}
.pill.warn{background:#fff3e6;color:#9a3412;}
.isc-scroll{overflow-x:auto;}
table.isc{min-width:760px;}
table.isc th{white-space:nowrap;}
table.isc td{vertical-align:middle;}
table.isc input.txt{padding:5px 8px;font-size:12.5px;}
.yn{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line-2);border-radius:6px;padding:3px 12px;cursor:pointer;background:#fff;}
.yn.yes{color:var(--ok);border-color:#a7e0c8;background:#f0faf5;}
.yn.no{color:var(--danger);border-color:#f3b9c2;background:#fdeef0;}
span.yn{cursor:default;display:inline-block;}
.cert-cell.danger{background:#fdeef0;}
.cert-cell.warn{background:#fff3e6;}
.cert-badge{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;}
.cert-badge.danger{background:#f8c9d2;color:#b3243b;}
.cert-badge.warn{background:#fcdcb8;color:#9a3412;}
.isc-add{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}

/* ---------- course group panel (corsi adulti/ragazzi/agonismo) ---------- */
.course-create{border:1px dashed var(--line-2);border-radius:var(--radius-sm);padding:14px;margin-bottom:18px;background:var(--surface-2);}
.course-create .field-label{margin-top:10px;}
.course-create .field-label:first-child{margin-top:0;}
.lesson-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.lesson-row .idx{font-size:11px;color:var(--muted);font-weight:600;width:16px;flex:none;}
.type-badge{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:99px;background:var(--accent-weak);color:var(--accent-ink);white-space:nowrap;}
.type-badge.cycle{background:#fef3c7;color:#92400e;}
.course-card{border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:12px;overflow:hidden;background:var(--surface);}
.course-card-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;flex-wrap:wrap;}
.course-card-head:hover{background:var(--surface-2);}
.course-card-title{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;flex:1;min-width:180px;}
.course-card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
.course-card-chev{transition:transform .15s;flex:none;color:var(--muted);}
.course-card-chev.open{transform:rotate(90deg);}
.course-card-body{padding:0 14px 14px;border-top:1px solid var(--line);}
.course-sub-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 8px;}
.course-sub-label:first-child{margin-top:14px;}
.cal-wrap{margin-bottom:18px;}
.cal-wrap .cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.cal-wrap .cal-nav .lbl{font-weight:700;font-size:13.5px;text-transform:capitalize;min-width:140px;text-align:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;}
.cal-dow{background:var(--surface-2);padding:6px 8px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center;}
.cal-cell{background:var(--surface);min-height:74px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;}
.cal-cell.other-month{background:var(--surface-2);}
.cal-cell.other-month .cal-daynum{color:var(--line-2);}
.cal-cell.today .cal-daynum{background:var(--accent);color:#fff;border-radius:99px;}
.cal-daynum{font-size:11px;font-weight:600;color:var(--ink-soft);width:19px;height:19px;display:flex;align-items:center;justify-content:center;}
.cal-lesson{font-size:9.5px;font-weight:600;padding:1px 5px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.reset-box{border:1px solid var(--danger);border-radius:var(--radius-sm);padding:12px 14px;background:#fff5f5;}
.reset-opt{display:flex;gap:8px;align-items:flex-start;padding:6px 0;cursor:pointer;font-size:12.5px;}
.reset-opt input{margin-top:3px;flex:none;}
.backup-list{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;max-height:230px;overflow-y:auto;}
.backup-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.backup-row:last-child{border-bottom:none;}
.backup-row:nth-child(odd){background:var(--surface-2);}
.backup-when{font-size:12px;font-weight:500;flex:1;min-width:150px;}
.trial-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:5px 7px;margin-bottom:5px;border:1px dashed var(--line-2);border-radius:8px;}
.trial-row.filled{border-style:solid;background:var(--surface-2);}
.trial-row .idx{font-size:11px;color:var(--muted);font-weight:600;width:16px;flex:none;}
.we-sel.warn{border-color:#f59e0b;background:#fffbeb;}
/* ---------- assistente AI turni ---------- */
.ai-box{border-top:1px solid var(--line);padding:14px 16px;background:var(--surface-2);}
.ai-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:9px;}
.ai-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;}
.ai-key{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.ai-input{width:100%;resize:vertical;font-family:inherit;font-size:12.5px;line-height:1.45;padding:9px 11px;}
.ai-proposal{margin-top:12px;padding:11px 13px;border:1px solid var(--accent);border-radius:var(--radius-sm);background:var(--surface);}
.ai-list{margin:0;padding-left:18px;font-size:12px;line-height:1.7;}
.ai-hidden{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;}
/* ---------- riepilogo ore sotto la griglia turni ---------- */
.grid-summary{border-top:1px solid var(--line);padding:14px 16px 16px;}
.gs-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.gs-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;}
.grid-summary table.rep tr.row-click{cursor:pointer;}
.grid-summary table.rep tr.row-click:hover{background:var(--surface-2);}
.grid-summary table.rep tr.sub td{font-size:11.5px;color:var(--ink-soft);background:var(--surface-2);}
.sector-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;margin-bottom:6px;}
.sector-card{border:1px solid var(--line);border-left-width:4px;border-radius:var(--radius-sm);padding:9px 11px;background:var(--surface);}
.sector-card.ok{border-left-color:#16a34a;}
.sector-card.due{border-left-color:#f59e0b;}
.sector-card.old{border-left-color:#dc2626;}
.sector-card.never{border-left-color:var(--line-2);background:var(--surface-2);}
.sector-name{font-size:13px;font-weight:700;margin-bottom:3px;}
.sector-when{font-size:11.5px;color:var(--ink-soft);}
.sector-who{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sector-age{font-size:10.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:4px;}
.sector-card.old .sector-age{color:#b91c1c;font-weight:700;}
.daycfg-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 8px;margin-bottom:5px;border-left:3px solid var(--accent-weak);background:var(--surface-2);border-radius:0 8px 8px 0;}
.daycfg-name{font-size:12px;font-weight:600;min-width:78px;color:var(--ink-soft);}
.day-chips{display:inline-flex;gap:3px;flex-wrap:wrap;}
.day-chips .mini-chip{padding:2px 7px;font-size:10.5px;}
.freq-pill{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;color:var(--accent-ink);background:var(--accent-weak);border-radius:99px;padding:1px 6px;white-space:nowrap;}
.roster-flag.extra{background:#dcfce7;color:#15803d;}
/* ---------- annate per tipologia di corso ---------- */
.years-box{border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:16px;background:var(--surface);overflow:hidden;}
.years-head{display:flex;align-items:center;gap:8px;width:100%;padding:11px 14px;background:none;border:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;}
.years-head:hover{background:var(--surface-2);}
.years-summary{font-weight:400;font-size:11.5px;color:var(--muted);margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%;}
.years-body{padding:0 14px 14px;border-top:1px solid var(--line);}
.years-row{display:flex;align-items:center;gap:8px;padding:5px 0;flex-wrap:wrap;}
.years-name{font-size:12.5px;font-weight:500;min-width:150px;flex:1;}
.roster-years.inline{display:inline-block;margin:0 0 0 6px;vertical-align:middle;}
.roster-years{display:block;font-size:10px;color:var(--accent-ink);background:var(--accent-weak);border-radius:4px;padding:1px 5px;margin-top:3px;width:fit-content;font-weight:600;}
.roster-year.off{color:#b91c1c;font-weight:700;}
.roster-flag.off{background:#fee2e2;color:#b91c1c;}
/* ---------- prospetto iscritti per giornata ---------- */
.roster-day{margin-top:6px;}
.roster-scroll{overflow-x:auto;}
table.rep.roster{min-width:100%;}
table.rep.roster th{vertical-align:top;font-size:11.5px;line-height:1.35;white-space:normal;min-width:150px;}
table.rep.roster.wide{min-width:max-content;}
table.rep.roster.wide th,table.rep.roster.wide td{min-width:158px;}
.roster-dayhead{text-align:center !important;background:var(--surface-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--line-2);}
table.rep.roster.wide .dstart{border-left:2px solid var(--line-2);}
.roster-title{display:block;font-weight:600;}
table.rep.roster.wide th.rn,table.rep.roster.wide td.rn{min-width:26px;position:sticky;left:0;background:var(--surface);z-index:2;}
table.rep.roster.wide thead th.rn{background:var(--surface-2);}
table.rep.roster td{font-size:12px;white-space:nowrap;}
table.rep.roster th.rn,table.rep.roster td.rn{width:26px;min-width:26px;text-align:right;color:var(--muted);font-size:10.5px;font-family:'IBM Plex Mono',monospace;}
.roster-dot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:middle;}
.roster-meta{display:block;font-weight:400;font-size:10.5px;color:var(--muted);margin-top:2px;}
.freq-name{font-weight:600;}
.freq-name.f1{color:var(--ink);}
.freq-name.f2{color:#15803d;}
.freq-name.f3{color:#0284c7;}
.freq-legend{display:inline-flex;gap:10px;margin-right:6px;}
.roster-year{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:10.5px;margin-left:6px;}
.roster-flag{display:inline-block;margin-left:6px;font-size:9.5px;font-weight:700;letter-spacing:.02em;padding:1px 5px;border-radius:99px;background:#fef3c7;color:#92400e;}
table.rep.roster td.cert-danger{background:#fee2e2;}
table.rep.roster td.cert-warn{background:#fef3c7;}
.cal-more{font-size:9.5px;color:var(--muted);font-weight:600;padding-left:4px;}

/* ---------- unified weekly grid (pagina turni) ---------- */
.wk-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);}
.wk-scroll{overflow:auto;max-height:74vh;position:relative;-webkit-overflow-scrolling:touch;}
.wk{display:grid;background:var(--line);gap:1px;min-width:min-content;}
.wk-corner{background:var(--surface-2);position:sticky;left:0;z-index:5;}
.wk-corner.c1{top:0;}
.wk-corner.c2{top:27px;}
.wk-day{background:var(--surface-2);position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap;padding:0 4px;overflow:hidden;}
.wk-day .wv-date{font-weight:500;color:var(--muted);}
.wk-day.closed{color:var(--muted);}
.wk-clear{border:none;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;padding:0;opacity:.55;transition:.1s;}
.wk-clear:hover{color:var(--danger);opacity:1;}
.wk-clear svg{width:11px;height:11px;}
.wk-col{background:var(--surface-2);position:sticky;top:27px;z-index:3;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;overflow:hidden;padding:0 14px 0 5px;}
.wk-col-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wk-add-col{background:var(--surface-2);position:sticky;top:27px;z-index:3;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.wk-add{width:100%;max-width:104px;font-family:inherit;font-size:10px;font-weight:600;color:var(--accent-ink);background:var(--accent-weak);border:1px dashed var(--accent);border-radius:6px;padding:2px 4px;cursor:pointer;}
.wk-add:hover{background:var(--accent);color:#fff;}
.wk-slot.noadd{background:var(--surface-2);cursor:default;}
.wk-slot.noadd:hover{background:var(--surface-2);}
.wk-col.vac{color:#9a3412;background:#fff1e7;}
.wk-col.ph{color:var(--line-2);}
.wk-col .col-hide{top:1px;right:1px;}
.wk-col:hover .col-hide{opacity:.65;}
.wk-time{background:var(--surface-2);position:sticky;left:0;z-index:2;display:flex;align-items:center;justify-content:flex-end;padding:0 6px;font-size:9px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.wk-time.hour{color:var(--ink-soft);font-weight:600;}
.wk-slot{background:var(--surface);cursor:crosshair;position:relative;transition:background .04s;touch-action:pan-x pan-y;}
.wk.painting .wk-slot{touch-action:none;}
.wk-slot.hour{box-shadow:inset 0 1px 0 var(--line-2);}
.wk-slot:hover{background:var(--accent-weak);}
.wk-slot.filled:hover{filter:brightness(.94);}
.wk-slot.ro{cursor:default;}
.wk-slot.ro:hover{background-color:var(--surface);filter:none;}
.wk-slot.ro.filled:hover{filter:none;}
.wk-slot.ferie{background-image:repeating-linear-gradient(45deg, rgba(120,130,150,.30) 0 4px, rgba(120,130,150,0) 4px 8px);cursor:not-allowed;}
.wk-slot.ferie:hover{background-color:var(--surface);filter:none;}
.wk-slot.course{cursor:default;}
.wk-slot.course::after{content:"";position:absolute;top:0;left:0;border-width:5px;border-style:solid;border-color:rgba(255,255,255,.85) transparent transparent rgba(255,255,255,.85);}
.wk-slot.closed:not(.filled){background:var(--surface-2);}
.wk-slot.ph{cursor:default;}
.wk-slot.ph:hover{background:var(--surface);}
.wk-slot.ph.closed:hover{background:var(--surface-2);}
.wk .dstart{border-left:2px solid var(--line-2);}
.wk .slot-lbl{font-size:8.5px;left:3px;right:2px;}

/* ---------- pagamenti ---------- */
.pay-controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
.pay-ovr td{background:#fff9ec;}
@media print{ body *{visibility:hidden;} .panel, .panel *{visibility:visible;} .app-head,.page-nav{display:none!important;} }

/* ---------- view toggle + week overview ---------- */
.viewtoggle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 14px;}
.wv-wrap{margin-top:4px;}
.wv-scroll{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch;}
.wv{display:grid;position:relative;}
.wv-corner{position:sticky;top:0;left:0;z-index:4;background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:36px;}
.wv-day{position:sticky;top:0;z-index:3;background:var(--surface-2);border-bottom:1px solid var(--line);border-right:1px solid var(--line);font:inherit;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;padding:7px 4px;text-align:center;white-space:nowrap;}
.wv-day:hover{background:var(--accent-weak);color:var(--accent-ink);}
.wv-date{font-weight:500;color:var(--muted);}
.wv-time{position:sticky;left:0;z-index:2;background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px dashed var(--line);font-size:10px;color:var(--muted);font-family:var(--mono,ui-monospace,monospace);padding:2px 6px;min-height:24px;display:flex;align-items:center;justify-content:flex-end;}
.wv-time.hour{color:var(--ink);font-weight:600;border-bottom-style:solid;}
.wv-cell{border-right:1px solid var(--line);border-bottom:1px dashed rgba(0,0,0,.05);min-height:24px;padding:2px;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;cursor:pointer;}
.wv-cell.hour{border-bottom:1px solid var(--line);}
.wv-cell:hover{background:rgba(58,85,217,.04);}
.wv-chip{font-size:9.5px;font-weight:700;border-radius:4px;padding:1px 5px;line-height:1.35;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------- month view ---------- */
.monthview{margin-top:4px;}
.mv-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.mv-list{display:flex;flex-direction:column;gap:8px;}
.mv-week{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;font:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;cursor:pointer;transition:.12s;box-shadow:var(--shadow);}
.mv-week:hover{border-color:var(--accent);transform:translateY(-1px);}
.mv-week.event{border-left:3px solid #c084fc;}
.mv-range{font-weight:600;font-size:13.5px;text-transform:capitalize;}
.mv-tag{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-2);padding:3px 10px;border-radius:99px;}
.mv-tag.event{color:#7c3aed;background:#f6efff;}

/* ---------- storico ---------- */
.stor-new{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.stor-list{display:flex;flex-direction:column;gap:10px;}
.stor-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);box-shadow:var(--shadow);}
.stor-card.open{border-color:var(--accent);}
.stor-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.stor-label{font-weight:700;font-size:14.5px;}
.stor-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.stor-quick{margin-top:8px;}
.stor-detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.stor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.sg{background:var(--surface-2);border-radius:9px;padding:10px 12px;}
.sg-n{font-weight:700;font-size:16px;}
.sg-l{font-size:11px;color:var(--muted);margin-top:2px;}
.stor-sub{margin-top:10px;font-size:12.5px;color:var(--ink-soft);}

/* ---------- eventi ---------- */
.ev-form{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
.ev-swatches{display:flex;gap:4px;}
.ev-sw{width:20px;height:20px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0;}
.ev-sw.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset;}
.ev-list{margin-top:14px;display:flex;flex-direction:column;gap:2px;}
.ev-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.ev-dot{width:12px;height:12px;border-radius:4px;flex:none;}
.ev-main{flex:1;font-size:13.5px;}
.ev-acts{display:flex;gap:6px;align-items:center;}

/* ---------- sub navigation ---------- */
.sub-nav{display:flex;gap:4px;flex-wrap:wrap;margin:-8px 0 18px;padding:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;}
.sub-nav .spg{font:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border:none;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;transition:.12s;}
.sub-nav .spg:hover:not(:disabled){background:#fff;color:var(--ink);}
.sub-nav .spg.on{background:var(--accent);color:#fff;}
.sub-nav .spg:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- week view bar + closures ---------- */
.wv-bar{display:flex;justify-content:flex-end;margin-bottom:8px;min-height:0;}
.wv-bar:empty{display:none;}
.wv-day.closed{background:#fdeef0;color:#b3243b;}
.wv-closed{display:block;font-size:9px;font-weight:800;letter-spacing:.04em;color:#b3243b;}
.wv-cell.closed{background:repeating-linear-gradient(45deg,rgba(239,68,68,.06),rgba(239,68,68,.06) 6px,transparent 6px,transparent 12px);}
.closed-banner{display:flex;align-items:center;gap:8px;background:#fdeef0;color:#b3243b;border:1px solid #f3b9c2;border-radius:9px;padding:9px 14px;margin-bottom:12px;font-size:13px;font-weight:600;}
.closed-banner svg{width:15px;height:15px;}
.ev-tag{display:inline-block;margin-left:6px;font-size:9.5px;font-weight:800;letter-spacing:.03em;padding:1px 6px;border-radius:99px;background:var(--surface-2);color:var(--muted);}
.ev-tag.closed{background:#fdeef0;color:#b3243b;}

/* ---------- winter week navigator ---------- */
.week-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px;box-shadow:var(--shadow);}
.wn-center{min-width:150px;text-align:center;}
.wn-range{font-weight:700;font-size:14px;text-transform:capitalize;}
.wn-tag{font-size:11.5px;font-weight:600;color:var(--muted);}
.wn-tag.event{color:#7c3aed;}

  try {
    const blob = new Blob([JSON.stringify(obj, null, 2)], {
      type: 'application/json'
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);

    a.remove();

    return true;
  } catch (e) {
    return false;
  }

/* ============================ Iscritti (corsi & agonismo) ============================ */
function certStatus(iso) {
  if (!iso) return {
    cls: 'warn',
    txt: 'manca'
  };
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const d = parseISO(iso);
  const days = Math.round((d - today) / 86400000);
  if (days < 0) return {
    cls: 'danger',
    txt: 'scaduto',
    days
  };
  if (days <= 30) return {
    cls: 'warn',
    txt: 'tra ' + days + 'g',
    days
  };
  return {
    cls: '',
    txt: d.toLocaleDateString('it-IT'),
    days
  };
}

  return {
    start,
    end: lastSunday
  };
